<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
    <meta name="description"
      content="One of the many ways to contct us here at White river rafting adventure">
    <meta name="author" content="Steven Scaff">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-crossedoars.png" alt="white river logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="about-container">
            <h1 class="about-1">Rafting Excursion</h1>
            <ul class="about-2">
                <li>123 Main River Street</li>
                <li>Kolob, California</li>
                <li>+1 999 999 9999</li>
                <li>info@whitewater.com</li>
            </ul>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3168.6127035242307!2d-113.15625606001495!3d37.422628172192454!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca91afad231a8f%3A0xec6734a36c88eb1f!2sKolob%20Canyons!5e0!3m2!1sen!2sus!4v1791433507695!5m2!1sen!2sus"
                  width="400" height="330" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="about-4" action="#">
                <fieldset>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Placeholder">

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required placeholder="Placeholder">

                    <p>Message Purpose</p>
                    <div class="about-4-1">

                        <input type="radio" id="general" name="general" required>
                        <label for="general">General Inquiry</label>


                        <input type="radio" id="reservation" name="reservation" required>
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="website" name="website" required>
                        <label for="website">Website Suggestion</label>
                    </div>

                    <label class="about-message" for="message">Message</label>
                    <textarea class="about-message-area" id="message" name="message" rows="4"
                      placeholder="Type here"></textarea>

                    <div class="about-subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>

                    <button class="about-button" type="submit">Get in Touch!</button>

                </fieldset>

            </form>
        </div>

        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="serve">
                <figure>
                    <img src="images/marcosdamata-woman.jpg" alt="lady smiling">
                    <figcaption>Stacy McLady</figcaption>
                </figure>
                <figure>
                    <img src="images/martymaine-man.jpg" alt="maine man">
                    <figcaption>Harry McMan</figcaption>
                </figure>
                <figure>
                    <img src="images/olgavolkovitskaia-man.jpg" alt="european man">
                    <figcaption>Brian Smith</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>

        <p>©2026 | White river rafting adventure fun | Steven Scaff</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-icon.png" alt="facebook icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin-icon.png" alt="linkedin icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-icon.png" alt="instagram icon">
            </a>
        </nav>
    </footer>

</body>

</html>
