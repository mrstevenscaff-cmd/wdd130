<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White River Rafting Adventure excitment page</title>
    <meta name="description"
      content="White river rafting adventure fun page that highlights the different activities offered">
    <meta name="author" content="Steven Scaff">
    <link rel="stylesheet" href="styles/rafting.css">


<body>
    <header>
        <img src="images/z-wwr-crossedoars.png" alt="white river logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="home">
            <img src="images/water-raft-main.jpg" alt="rafting trip side">
            <h1>Have An Adventure</h1>
            <form class="about-4" action="#">
                <fieldset>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Placeholder">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required placeholder="Placeholder">
                    <button class="about-button" type="submit">Sign up for our newsletter</button>

                </fieldset>

            </form>
        </div>

        <section class="home-activity">
            <figure>
                <img src="images/main-small-river.jpg" alt="river">
                <figcaption>River</figcaption>
            </figure>
            <figure>
                <img src="images/main-small-rapid.jpg" alt="rapids">
                <figcaption>Rapids</figcaption>
            </figure>
            <figure>
                <img src="images/main-small-camp.jpg" alt="campling">
                <figcaption>Camping</figcaption>
            </figure>

        </section>

    </main>
    <footer>

        <p>©2026 | White river rafting adventure fun | Steven Scaff</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-icon.png" alt="facebook icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin-icon.png" alt="linkedin icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-icon.png" alt="instagram icon">
            </a>
        </nav>
    </footer>

</body>

</html>
